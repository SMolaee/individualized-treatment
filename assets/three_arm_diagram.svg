<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <style>
    .title { font: bold 16px sans-serif; }
    .label { font: 12px sans-serif; }
    .box { fill: #f7fbff; stroke: #2b6cb0; stroke-width: 2px; rx:8; }
    .arrow { stroke: #2b6cb0; stroke-width: 2; fill: none; marker-end: url(#arrowhead);} 
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2b6cb0" />
    </marker>
  </defs>

  <text x="20" y="28" class="title">Three-arm simulation & evaluation (concept)</text>

  <!-- Cohort box -->
  <rect x="20" y="50" width="180" height="60" class="box" />
  <text x="30" y="75" class="label">Cohort (n = 3·n_per_arm)</text>
  <text x="30" y="95" class="label">Features: EEG | HRV | PSY | Age | Sex</text>

  <!-- Randomization -->
  <rect x="240" y="50" width="140" height="60" class="box" />
  <text x="250" y="80" class="label">Randomize 1:1:1</text>

  <!-- Arms -->
  <rect x="420" y="20" width="100" height="40" class="box" />
  <text x="440" y="45" class="label">Sham (0)</text>
  <rect x="420" y="80" width="100" height="40" class="box" />
  <text x="446" y="105" class="label">tVNS (1)</text>
  <rect x="420" y="140" width="100" height="40" class="box" />
  <text x="452" y="165" class="label">NF (2)</text>

  <!-- Model box -->
  <rect x="560" y="50" width="200" height="120" class="box" />
  <text x="572" y="75" class="label">Meta-learners</text>
  <text x="572" y="95" class="label">S-learner | T-learner | X-learner</text>
  <text x="572" y="115" class="label">5-fold CV → OOF ITEs</text>

  <!-- Outputs -->
  <rect x="580" y="190" width="180" height="70" class="box" />
  <text x="592" y="215" class="label">Outputs</text>
  <text x="592" y="235" class="label">performance CSVs, bootstrap CIs</text>
  <text x="592" y="255" class="label">robustness tables, SHAP</text>

  <!-- Arrows -->
  <path d="M200 80 L240 80" class="arrow" />
  <path d="M380 80 L420 80" class="arrow" />
  <path d="M520 40 L560 70" class="arrow" />
  <path d="M520 100 L560 100" class="arrow" />
  <path d="M520 160 L560 130" class="arrow" />
  <path d="M660 170 L660 190" class="arrow" />

</svg>
